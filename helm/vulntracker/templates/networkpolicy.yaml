{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vulntracker.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "vulntracker.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vulntracker.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ index .Values.networkPolicy.ingressPodSelector.matchLabels "app.kubernetes.io/name" | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.container.port }}
{{- end }}

